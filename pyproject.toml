[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-control-center"
version = "0.1.0"
description = "A local-first GitHub portfolio audit and prioritization tool"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pcc = "project_control_center.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

